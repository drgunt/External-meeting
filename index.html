<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ขออนุมัติไปประชุม · BUDHOSPITAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#5b84f7; --blue-d:#3f68e0; --blue-l:#eef3ff; --teal:#1fd1a5; --amber:#f9a825; --red:#ef5350; --orange:#ff8a3d;
  --ink:#2b2f38; --muted:#8a93a6; --line:#e4e9f2; --bg:#f6f8fc; --card:#fff; --head:#dfe7fb;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Prompt',system-ui,sans-serif;font-weight:300;color:var(--ink);background:var(--bg);font-size:15px}
b,strong,th{font-weight:500}
a{color:var(--blue)}
button,input,select,textarea{font:inherit}
/* layout */
#sb{position:fixed;inset:0 auto 0 0;width:270px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transition:transform .2s}
.logo{padding:22px 24px;font-weight:600;font-size:22px;letter-spacing:.5px;background:linear-gradient(90deg,#1e9bff,#21d4a3);-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:center;gap:8px}
.logo span.ic{font-size:22px;-webkit-text-fill-color:initial}
.nav{flex:1;overflow:auto;padding:4px 16px}
.nav h6{margin:14px 6px 8px;font-size:13px;font-weight:500;letter-spacing:.5px;color:#333}
.nav a{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:10px;color:var(--ink);text-decoration:none;margin-bottom:4px}
.nav a:hover{background:var(--blue-l)}
.nav a.on{background:var(--blue);color:#fff;font-weight:400}
.nav a .bd{margin-left:auto;background:var(--red);color:#fff;border-radius:20px;font-size:12px;padding:1px 8px}
.nav a.on .bd{background:#fff;color:var(--blue)}
.ucard{margin:12px 16px 16px;background:var(--blue-l);border-radius:14px;padding:14px}
.ucard .row{display:flex;gap:10px;align-items:center}
.ucard select{width:100%;margin-top:10px;padding:7px;border:1px solid var(--blue);border-radius:8px;color:var(--blue);background:#fff}
.ucard small{color:var(--muted);font-size:12px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:500;flex:none;background:linear-gradient(135deg,#5b84f7,#21d4a3)}
main{margin-left:270px;min-height:100vh}
.top{height:64px;background:#fff;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .ham{display:none;border:0;background:none;font-size:24px;cursor:pointer}
.top .who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
.top .who small{display:block;color:var(--muted);font-size:12px}
.wrap{padding:22px;max-width:1280px}
.banner{background:var(--blue);color:#fff;padding:14px 22px;border-radius:12px;font-size:20px;font-weight:400;margin-bottom:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.banner small{font-size:14px;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
.card h2{margin:0 0 14px;font-size:20px;font-weight:400}
.card h3{margin:0 0 10px;font-size:16px;font-weight:500}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.sticky{position:sticky;top:84px}
table.t{width:100%;border-collapse:collapse}
.t th{background:var(--head);border:1px solid #c9d5f3;padding:9px 10px;font-weight:500}
.t td{border:1px solid var(--line);padding:8px 10px}
.t td.n,.t th.n{text-align:right}.t td.c{text-align:center}
.t tr.tot td{background:#f5f7fd;font-weight:500}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:#f7f9ff}
.tbl{overflow-x:auto}
label.f{display:block;font-size:13px;color:#56607a;margin-bottom:4px}
.in{width:100%;padding:9px 11px;border:1px solid #d3dbea;border-radius:9px;background:#fff;color:var(--ink)}
.in:focus{outline:2px solid #c7d6ff;border-color:var(--blue)}
textarea.in{min-height:80px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:7px;border:1px solid #d3dbea;border-radius:9px;padding:8px 12px;cursor:pointer;background:#fff}
.opt:has(input:checked){border-color:var(--blue);background:var(--blue-l);color:var(--blue-d)}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.sec{font-size:15px;font-weight:500;color:var(--blue-d);margin:22px 0 12px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.sec:first-child{margin-top:0}
.btn{border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--blue);color:#fff;font-weight:400;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--blue-d)}
.btn.o{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.g{background:var(--teal)}.btn.r{background:var(--red)}.btn.y{background:var(--orange)}
.btn.s{padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-block;border-radius:20px;padding:3px 12px;font-size:13px;font-weight:400;white-space:nowrap}
.p-wait{background:#fff4dc;color:#b77800}.p-ok{background:#dcf8ef;color:#0b8a66}.p-bad{background:#ffe3e3;color:#c62828}
.p-ret{background:#ffeadb;color:#c25500}.p-done{background:#e6ecff;color:#3f68e0}.p-gray{background:#eceff4;color:#69738a}
.err{background:#fff0f0;border:1px solid #ffc9c9;color:#b71c1c;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.warn{background:#fff8e6;border:1px solid #ffe2a3;color:#8a5a00;border-radius:10px;padding:10px 14px;font-size:14px;margin:10px 0}
.ok{background:#e9fbf4;border:1px solid #b6eed8;color:#0b6b50;border-radius:10px;padding:10px 14px;font-size:14px;margin:10px 0}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.big{font-size:30px;font-weight:500;color:var(--blue-d)}
.stat{background:var(--blue-l);border-radius:12px;padding:14px}
.stat small{color:#56607a;display:block}
.sum-row{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;border-bottom:1px dotted var(--line)}
.sum-row.tot{font-weight:500;font-size:16px;border:0;padding-top:10px}
/* stepper */
.steps{display:flex;justify-content:space-between;position:relative;margin:10px 0 6px;overflow-x:auto}
.step{flex:1;text-align:center;min-width:95px;position:relative}
.step:not(:last-child)::after{content:'';position:absolute;top:26px;left:calc(50% + 30px);right:calc(-50% + 30px);border-top:2px dashed #d8dee9}
.step.done:not(:last-child)::after{border-top:2px solid var(--teal)}
.dot{width:52px;height:52px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:500;background:#cfd6e3}
.step.done .dot{background:var(--teal)}.step.cur .dot{background:var(--amber);box-shadow:0 0 0 6px #fff1cc}
.step.bad .dot{background:var(--red)}
.step b{display:block;font-size:13.5px;font-weight:400}.step small{display:block;color:var(--muted);font-size:12px}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line);margin-left:6px}
.tl li::before{content:'';position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--blue)}
.tl li:last-child{border-color:transparent}
.tl small{color:var(--muted)}
.rules li{padding:8px 0;border-bottom:1px solid var(--line);line-height:1.6}
.hide{display:none!important}
.muted{color:var(--muted)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(20,30,60,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:16px;max-width:780px;width:100%;padding:22px}
#modal .box h2{margin:0 0 14px;font-weight:400}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#263238;color:#fff;padding:10px 20px;border-radius:10px;z-index:60;display:none}
#print{display:none}
.cam{position:relative;background:#111;border-radius:12px;overflow:hidden;aspect-ratio:4/3}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;display:block}
.cam .oval{position:absolute;left:50%;top:50%;width:46%;height:72%;transform:translate(-50%,-50%);border:3px dashed rgba(255,255,255,.8);border-radius:50%;pointer-events:none}
.cam .msg{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.55);color:#fff;font-size:13px;padding:6px 10px;text-align:center}
.thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#e9edf5;vertical-align:middle;cursor:pointer}
.refrow{display:grid;grid-template-columns:170px 1fr 150px 34px;gap:8px;margin-bottom:6px;align-items:start}
.refrow .lk{grid-column:1/-1;font-size:12.5px;margin:-2px 0 4px}
.xbtn{border:1px solid #f3c1c1;background:#fff;color:var(--red);border-radius:8px;height:40px;cursor:pointer}
.files{list-style:none;margin:8px 0 0;padding:0}
.files li{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;font-size:14px}
.files li a{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop{border:2px dashed #c9d5f3;border-radius:12px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;background:#fafbff}
.drop:hover{border-color:var(--blue);color:var(--blue)}
@media (max-width:860px){.refrow{grid-template-columns:1fr 1fr}.refrow .xbtn{grid-column:2}}
@media (max-width:1000px){.split{grid-template-columns:1fr}.sticky{position:static}.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  #sb{transform:translateX(-100%)} body.nav-open #sb{transform:none;box-shadow:0 0 40px rgba(0,0,0,.2)}
  main{margin-left:0}.top .ham{display:block}.wrap{padding:16px}
  .g2,.g3{grid-template-columns:1fr}.kv{grid-template-columns:110px 1fr}
  .top .who div{display:none}
}
/* ---------- print (เอกสารราชการ) ---------- */
@media print{
  @page{size:A4;margin:2cm 2cm 2cm 3cm}
  body{background:#fff}
  #sb,main,#modal,#toast{display:none!important}
  #print{display:block;font-family:'Sarabun',serif;font-size:15pt;line-height:1.55;color:#000}
  #print h1{text-align:center;font-size:24pt;margin:0 0 6pt}
  #print h2{text-align:center;font-size:17pt;margin:0 0 10pt}
  #print p{margin:0 0 6pt}
  #print .ind{text-indent:2.5cm}
  #print table{width:100%;border-collapse:collapse;font-size:14pt;margin:6pt 0}
  #print td,#print th{border:1px solid #000;padding:2pt 6pt}
  #print .n{text-align:right}
  #print .sign{margin:20pt 0 0 45%;text-align:center}
  #print .box2{display:grid;grid-template-columns:1fr 1fr;gap:10pt;margin-top:14pt}
  #print .bx{border:1px solid #000;padding:6pt 8pt;font-size:14pt;min-height:120pt}
  #print .pb{page-break-before:always}
  #print .hdr td{border:0;padding:0 0 4pt}
}
</style>
</head>
<body>
<aside id="sb">
  <div class="logo"><span class="ic">✚</span>BUDHOSPITAL</div>
  <nav class="nav" id="nav"></nav>
  <div class="ucard" id="ucard"></div>
</aside>
<main>
  <div class="top">
    <button class="ham" onclick="document.body.classList.toggle('nav-open')" aria-label="เมนู">☰</button>
    <div style="font-weight:400">ระบบขออนุมัติไปประชุม / อบรม / สัมมนาภายนอก</div>
    <div class="who" id="who"></div>
  </div>
  <div class="wrap" id="view"></div>
</main>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<div id="print"></div>

<script>
'use strict';
/* =====================================================================
   ข้อมูลตั้งต้น (ข้อมูลสมมติทั้งหมด — ไม่ใช่บุคคลจริง)
   ===================================================================== */
const HOSP = 'โรงพยาบาลพุทธชินราช พิษณุโลก';
const USERS = [
  {id:'s1',name:'นพ.ก้องภพ ตัวอย่าง',      pos:'นายแพทย์ชำนาญการ',                    dept:'กลุ่มงานนิติเวช',               role:'staff',   grade:'A'},
  {id:'s2',name:'น.ส.พิมพ์ชนก ทดลอง',      pos:'นักวิทยาศาสตร์การแพทย์ปฏิบัติการ',      dept:'กลุ่มงานนิติเวช',               role:'staff',   grade:'A'},
  {id:'s3',name:'นายธนา สมมติ',            pos:'เจ้าพนักงานวิทยาศาสตร์การแพทย์ชำนาญงาน', dept:'กลุ่มงานนิติเวช',               role:'staff',   grade:'A'},
  {id:'h1',name:'นพ.วิทยา หัวหน้าตัวอย่าง', pos:'นายแพทย์ชำนาญการพิเศษ',               dept:'กลุ่มงานนิติเวช',               role:'head',    grade:'B'},
  {id:'s4',name:'พญ.อรุณี ตัวอย่าง',        pos:'นายแพทย์ชำนาญการ',                    dept:'กลุ่มงานพยาธิวิทยากายวิภาค',     role:'staff',   grade:'A'},
  {id:'h2',name:'พญ.สุดา หัวหน้าทดลอง',    pos:'นายแพทย์ชำนาญการพิเศษ',               dept:'กลุ่มงานพยาธิวิทยากายวิภาค',     role:'head',    grade:'B'},
  {id:'d1',name:'นพ.ผู้อำนวยการ สมมติ',     pos:'ผู้อำนวยการ'+HOSP,                     dept:'สำนักผู้อำนวยการ',              role:'director',grade:'B'},
  {id:'f1',name:'นางการเงิน ตัวอย่าง',      pos:'นักวิชาการเงินและบัญชีชำนาญการ',        dept:'กลุ่มงานการเงิน',               role:'finance', grade:'A'},
];
const ROLE_TXT = {staff:'ผู้ขอ / บุคลากร',head:'หัวหน้ากลุ่มงาน',director:'ผู้อำนวยการ',finance:'เจ้าหน้าที่การเงิน'};
const KIND = {conf:'ประชุมวิชาการ',train:'อบรม',seminar:'สัมมนา',workshop:'ประชุมเชิงปฏิบัติการ',study:'ศึกษาดูงาน'};
const TRAVEL = {
  private_car:'รถยนต์ส่วนตัว',official_car:'รถยนต์ราชการ (โรงพยาบาล)',plane:'เครื่องบิน',
  bus:'รถโดยสารประจำทาง',train:'รถไฟ',other:'อื่น ๆ (รถรับจ้าง/แท็กซี่)'
};
const FARE_TRAVEL = ['plane','bus','train'];
const ROLE_MEET = {attend:'เข้าฟังอย่างเดียว (เต็มวัน)',speaker:'เป็นวิทยากรอย่างเดียว',both:'เป็นวิทยากรและเข้าฟัง'};
const REF_KIND = {ext:'หนังสือเชิญ (ภายนอก)',int:'หนังสือภายใน รพ.'};
/* ทะเบียนหนังสือภายใน (จำลองระบบสารบรรณ) — ใช้ค้นจากเลขหนังสือ */
const INTERNAL_DOCS = [
  {no:'พล 0033.205/ว 145',date:'2026-09-20',subject:'ขอเชิญส่งบุคลากรเข้ารับการอบรมการเก็บรักษาวัตถุพยานทางชีววิทยา',from:'กลุ่มงานพัฒนาทรัพยากรบุคคล'},
  {no:'พล 0033.102/2580',date:'2026-09-28',subject:'แจ้งกำหนดการประชุมวิชาการเครือข่ายนิติเวชภาคเหนือ',from:'กลุ่มงานนิติเวช'},
  {no:'พล 0033.001/ว 77',date:'2026-10-01',subject:'ประชาสัมพันธ์การสัมมนาพยาธิวิทยาดิจิทัล',from:'สำนักผู้อำนวยการ'},
];
const normNo = s=>String(s||'').replace(/\s+/g,'').replace(/[๐-๙]/g,d=>'๐๑๒๓๔๕๖๗๘๙'.indexOf(d)).toLowerCase();
const findInternal = no=>no?INTERNAL_DOCS.find(d=>normNo(d.no)===normNo(no)):null;
const BUDGET = ['เงินบำรุงโรงพยาบาล','เงินงบประมาณ','ผู้จัดออกค่าใช้จ่าย','ไม่เบิกค่าใช้จ่าย'];
const STATUS = {
  pending_head:['รอหัวหน้ากลุ่มงานอนุมัติ','p-wait'], pending_dir:['รอผู้อำนวยการอนุมัติ','p-wait'],
  returned:['ส่งกลับแก้ไข','p-ret'], approved:['อนุมัติแล้ว · รอสรุปประชุม','p-ok'],
  reported:['ส่งสรุปแล้ว · รอทำเรื่องเบิก','p-ok'], claim_pending:['รอการเงินตรวจเบิก','p-wait'],
  paid:['เบิกจ่ายแล้ว','p-done'], closed:['ปิดเรื่อง (ไม่เบิก)','p-done'],
  rejected:['ไม่อนุมัติ','p-bad'], cancelled:['ยกเลิก','p-gray'],
};
const DEFAULT_SETTINGS = {
  quota:2,                 // สิทธิ์ไปประชุมต่อคนต่อปีงบประมาณ
  perDiemA:240, perDiemB:270,      // เบี้ยเลี้ยงเหมาจ่าย/วัน (ประเภท ก / ข)
  lodgingA:1500, lodgingB:2200,    // ค่าเช่าที่พักจ่ายจริงห้องเดี่ยว ไม่เกิน/คืน
  carRate:4,               // รถยนต์ส่วนตัว บาท/กม.
  p4pAttendDay:10, p4pSpeakerHour:25,   // เกณฑ์ P4P (สมมติ ปรับได้): เข้าฟังเต็มวัน / วิทยากรต่อชั่วโมง
  reportDays:15,           // ต้องส่งสรุปภายใน n วันหลังกลับ
  gpsRadius:300,           // รัศมี (เมตร) จากพิกัดห้องประชุมที่ถือว่าอยู่ในที่ประชุม
};

/* =====================================================================
   Utilities
   ===================================================================== */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const money = n=>num(n).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2});
const pad = n=>String(n).padStart(2,'0');
const isoOf = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = ()=>isoOf(new Date());
const parseD = s=>{if(!s)return null;const [y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const addDays = (s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return isoOf(d)};
const dayDiff = (a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const fmtD = s=>s?parseD(s).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'}):'-';
const fmtDL = s=>s?parseD(s).toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'}):'-';

function bahtText(v){
  v=Math.round(num(v)*100)/100;
  const N=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const conv=s=>{
    let out='';
    if(s.length>6){out+=conv(s.slice(0,-6))+'ล้าน';s=s.slice(-6)}
    const L=s.length;
    for(let i=0;i<L;i++){const d=+s[i],p=L-i-1;if(!d)continue;
      if(p===1&&d===1)out+='สิบ';else if(p===1&&d===2)out+='ยี่สิบ';
      else if(p===0&&d===1&&L>1&&/[1-9]/.test(s.slice(0,-1)))out+='เอ็ด';else out+=N[d]+P[p];}
    return out;
  };
  const i=Math.floor(v),st=Math.round((v-i)*100);
  let t=i>0?conv(String(i))+'บาท':(st?'':'ศูนย์บาท');
  return t+(st?conv(String(st))+'สตางค์':'ถ้วน');
}

const IDB={
  _p:null,
  open(){return this._p||(this._p=new Promise((res,rej)=>{const q=indexedDB.open('extmeet',1);q.onupgradeneeded=()=>q.result.createObjectStore('files');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}))},
  async tx(mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('files',mode);const q=fn(t.objectStore('files'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})},
  put(id,blob){return this.tx('readwrite',s=>s.put(blob,id))},
  get(id){return this.tx('readonly',s=>s.get(id))},
  del(id){return this.tx('readwrite',s=>s.delete(id))},
  clear(){return this.tx('readwrite',s=>s.clear())},
};

const people = r=>[r.requesterId,...(r.attendMode==='group'?(r.memberIds||[]):[])].map(user).filter(Boolean);
const perDiemRate = u=>u.grade==='B'?S().perDiemB:S().perDiemA;
const lodgingCap = u=>u.grade==='B'?S().lodgingB:S().lodgingA;
const COUNTED_OUT = ['rejected','cancelled'];
const PENDING = ['pending_head','pending_dir','returned'];

function quotaOf(uid,fy,excludeId){
  const list=db.requests.filter(r=>r.id!==excludeId&&r.quotaUse&&!COUNTED_OUT.includes(r.status)&&r.meetStart&&fyOf(r.meetStart)===fy&&people(r).some(p=>p.id===uid));
  const pending=list.filter(r=>PENDING.includes(r.status)).length;
  const used=list.length-pending;
  return {used,pending,left:S().quota-list.length,list};
}
function calcEst(r){
  const ok=r.departDate&&r.returnDate&&dayDiff(r.departDate,r.returnDate)>=0;
  const days=ok?dayDiff(r.departDate,r.returnDate)+1:0;
  const nights=r.lodgingNights===''||r.lodgingNights==null?Math.max(0,days-1):num(r.lodgingNights);
  const rows=people(r).map(u=>{
    const cap=lodgingCap(u),rate=Math.min(num(r.lodgingRate),cap);
    const row={u,perDiem:days*perDiemRate(u),lodging:nights*rate,reg:num(r.regFee),fare:FARE_TRAVEL.includes(r.travel)?num(r.fare):0,over:num(r.lodgingRate)>cap,cap};
    row.total=row.perDiem+row.lodging+row.reg+row.fare;return row;
  });
  const shared=r.travel==='private_car'?num(r.distanceKm)*S().carRate:(['official_car','other'].includes(r.travel)?num(r.sharedCost):0);
  const total=rows.reduce((a,x)=>a+x.total,0)+shared;
  return {days,nights,rows,shared,total:r.budgetSource==='ไม่เบิกค่าใช้จ่าย'||r.budgetSource==='ผู้จัดออกค่าใช้จ่าย'?0:total,gross:total};
}
function meetDays(r){return r.meetStart&&r.meetEnd&&dayDiff(r.meetStart,r.meetEnd)>=0?dayDiff(r.meetStart,r.meetEnd)+1:0}
function calcP4P(r,hours){
  const s=S(),d=meetDays(r),h=hours??num(r.speakerHours);
  const parts=[];
  if(r.role!=='speaker')parts.push({t:`เข้าฟังเต็มวัน ${d} วัน × ${s.p4pAttendDay}`,v:d*s.p4pAttendDay});
  if(r.role!=='attend')parts.push({t:`วิทยากร ${h} ชม. × ${s.p4pSpeakerHour}`,v:h*s.p4pSpeakerHour});
  return {parts,total:parts.reduce((a,x)=>a+x.v,0),member:d*s.p4pAttendDay};
}
/* ---------- ลงเวลาเข้าประชุม (สแกนหน้า + GPS) ---------- */
function meetDayList(r){const out=[];for(let i=0;i<meetDays(r);i++)out.push(addDays(r.meetStart,i));return out}
// ผู้เข้าฟัง/ผู้ร่วมเดินทาง: ต้องลงเวลาทุกวันประชุม · วิทยากรอย่างเดียว: ลงเฉพาะวันบรรยาย
function requiredDaysFor(r,uid){return uid===r.requesterId&&r.role==='speaker'?[r.speakDate||r.meetStart]:meetDayList(r)}
const checkinOf = (r,uid,day)=>(r.checkins||[]).find(c=>c.uid===uid&&c.day===day);
const checkinDone = (r,uid)=>requiredDaysFor(r,uid).every(d=>checkinOf(r,uid,d));
const allCheckedIn = r=>people(r).every(p=>checkinDone(r,p.id));
function distM(a1,o1,a2,o2){const R=6371e3,k=Math.PI/180,dA=(a2-a1)*k,dO=(o2-o1)*k;const x=Math.sin(dA/2)**2+Math.cos(a1*k)*Math.cos(a2*k)*Math.sin(dO/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const mapLink = (lat,lng,t='แผนที่')=>`<a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" rel="noopener">${t}</a>`;
const fmtDist = m=>m==null?'-':m>=1000?(m/1000).toFixed(1)+' กม.':Math.round(m)+' ม.';
/* เบี้ยเลี้ยงตามระเบียบ: 24 ชม. = 1 วัน, เศษเกิน 12 ชม. = 1 วัน; ไม่พักแรม เศษเกิน 6 ชม. = ครึ่งวัน; ผู้จัดเลี้ยงอาหาร หักมื้อละ 1/3 */
function perDiemDays(depDT,retDT,lodged){
  if(!depDT||!retDT)return 0;
  const h=(new Date(retDT)-new Date(depDT))/36e5;if(h<=0)return 0;
  const full=Math.floor(h/24),rem=h-full*24;
  if(rem>12)return full+1;
  if(!lodged&&rem>6)return full+0.5;
  return full;
}
function calcClaim(r,c){
  const est=calcEst(r);
  const days=perDiemDays(c.departDT,c.returnDT,est.nights>0||num(c.lodging)>0);
  const ppl=people(r);
  const rows=ppl.map(u=>{const rate=perDiemRate(u);const pd=Math.max(0,days*rate-num(c.meals)*rate/3);return {u,rate,perDiem:Math.round(pd*100)/100}});
  const n=ppl.length||1;
  rows.forEach(x=>{x.lodging=num(c.lodging)/n;x.transport=num(c.transport)/n;x.reg=num(c.regFee)/n;x.other=num(c.other)/n;x.total=x.perDiem+x.lodging+x.transport+x.reg+x.other});
  const capTotal=ppl.reduce((a,u)=>a+lodgingCap(u),0)*Math.max(est.nights,0);
  return {days,rows,total:rows.reduce((a,x)=>a+x.total,0),capTotal,lodgingOver:num(c.lodging)>capTotal&&capTotal>=0&&num(c.lodging)>0};
}

const pill = s=>`<span class="pill ${STATUS[s][1]}">${STATUS[s][0]}</span>`;
function stepIndex(r){
  if(r.status==='approved')return allCheckedIn(r)?4:3;
  return {pending_head:1,returned:1,pending_dir:2,reported:5,claim_pending:6,paid:7,closed:7,rejected:-1,cancelled:-1}[r.status];
}
function stepper(r){
  const st=['ยื่นเรื่อง','หัวหน้ากลุ่มงาน','ผู้อำนวยการ','ลงเวลาเข้าประชุม','สรุปการประชุม','ทำเรื่องเบิก','การเงินจ่าย'];
  const req=user(r.requesterId);
  const head=USERS.find(u=>u.role==='head'&&u.dept===req.dept);
  const ci=people(r).reduce((a,p)=>a+requiredDaysFor(r,p.id).filter(d=>checkinOf(r,p.id,d)).length,0);
  const ciN=people(r).reduce((a,p)=>a+requiredDaysFor(r,p.id).length,0);
  const sub=[req.name,head?.name||'',user('d1').name,`สแกนหน้า + GPS (${ci}/${ciN})`,'ผู้เดินทาง','ผู้เดินทาง','กลุ่มงานการเงิน'];
  let idx=stepIndex(r);
  let badAt=-1;
  if(idx===-1){ // ไม่อนุมัติ/ยกเลิก: หาว่าหยุดที่ขั้นไหน
    const hasDir=r.history.some(h=>h.role==='director'&&/อนุมัติ$/.test(h.action)&&!/ไม่/.test(h.action));
    const hasHead=r.history.some(h=>h.role==='head'&&/เห็นชอบ/.test(h.action));
    badAt=hasDir?3:hasHead?2:1; idx=badAt;
  }
  const doneTo = r.status==='paid'||r.status==='closed'?7:idx;
  return `<div class="steps">${st.map((s,i)=>{
    let cls=i<doneTo?'done':(i===idx?'cur':'');
    if(i===badAt)cls='bad';
    const icon=cls==='done'?'✓':cls==='bad'?'✕':(i===0?'➤':i);
    return `<div class="step ${cls}"><div class="dot">${icon}</div><b>${s}</b><small>${esc(sub[i])}</small></div>`}).join('')}</div>`;
}
function reqTable(list,empty='ไม่พบข้อมูล'){
  if(!list.length)return `<div class="muted" style="padding:14px">${empty}</div>`;
  return `<div class="tbl"><table class="t"><thead><tr><th>เลขที่</th><th>เรื่อง</th><th>ผู้ขอ</th><th>วันประชุม</th><th class="n">ประมาณการ (บาท)</th><th>สถานะ</th></tr></thead><tbody>${
    list.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(r=>`<tr class="click" onclick="location.hash='#/r/${r.id}'">
      <td>${esc(r.no)}</td><td>${esc(r.title)}<br><small class="muted">${KIND[r.kind]} · ${esc(r.province)} · ${r.attendMode==='group'?`กลุ่ม ${people(r).length} คน`:'คนเดียว'}</small></td>
      <td>${esc(user(r.requesterId).name)}</td><td>${fmtD(r.meetStart)}</td><td class="n">${money(calcEst(r).total)}</td><td>${pill(r.status)}</td></tr>`).join('')}</tbody></table></div>`;
}
function quotaTable(uid,fy){
  const q=quotaOf(uid,fy);
  const noQ=db.requests.filter(r=>!r.quotaUse&&!COUNTED_OUT.includes(r.status)&&r.meetStart&&fyOf(r.meetStart)===fy&&people(r).some(p=>p.id===uid)).length;
  const p4p=db.requests.filter(r=>!COUNTED_OUT.includes(r.status)&&!PENDING.includes(r.status)&&r.meetStart&&fyOf(r.meetStart)===fy&&people(r).some(p=>p.id===uid))
    .reduce((a,r)=>a+(r.requesterId===uid?calcP4P(r,r.report?num(r.report.speakerHours):undefined).total:calcP4P(r).member),0);
  return `<div class="tbl"><table class="t"><thead><tr><th>ประเภท</th><th>สิทธิ์</th><th>ใช้ไปแล้ว (อนุมัติ)</th><th>รออนุมัติ</th><th>คงเหลือ</th></tr></thead><tbody>
    <tr><td><b>ไปประชุม / อบรม / สัมมนา (ใช้สิทธิ์)</b></td><td class="c">${S().quota}</td><td class="c">${q.used}</td><td class="c">${q.pending}</td><td class="c"><b style="color:${q.left>0?'#0b8a66':'#c62828'}">${q.left}</b></td></tr>
    <tr><td><b>ไม่นับสิทธิ์</b> <small class="muted">(ได้รับเชิญเป็นวิทยากร / ผู้จัดออกค่าใช้จ่าย)</small></td><td class="c">-</td><td class="c">${noQ}</td><td class="c">-</td><td class="c">-</td></tr>
    <tr><td><b>คะแนน P4P จากการไปประชุม</b> <small class="muted">(ที่อนุมัติแล้ว)</small></td><td class="c" colspan="4"><b>${money(p4p)}</b> คะแนน</td></tr>
  </tbody></table></div>`;
}

function ciCard(r){
  if(['pending_head','pending_dir','returned','rejected'].includes(r.status))return '';
  const rows=[];
  people(r).forEach(p=>requiredDaysFor(r,p.id).forEach(d=>{
    const c=checkinOf(r,p.id,d);
    rows.push(`<tr><td>${esc(p.name)}</td><td>${fmtD(d)}${p.id===r.requesterId&&r.role!=='attend'&&d===r.speakDate?' <small class="muted">(วันบรรยาย)</small>':''}</td>
     ${c?`<td class="c">${c.photoId?`<img class="thumb" data-fid="${c.photoId}" data-open="${c.photoId}" alt="ภาพสแกนหน้า">`:'<span class="muted">-</span>'}</td>
       <td>${new Date(c.at).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})} น.${c.demo?' <span class="pill p-gray">สาธิต</span>':''}</td>
       <td>${mapLink(c.lat,c.lng,`${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}`)}<br><small class="muted">±${Math.round(c.acc)} ม.</small></td>
       <td>${c.dist==null?'<span class="pill p-wait">ไม่มีพิกัดอ้างอิง</span>':c.inRange?`<span class="pill p-ok">✓ ในที่ประชุม ${fmtDist(c.dist)}</span>`:`<span class="pill p-bad">ห่าง ${fmtDist(c.dist)}</span>`}${c.note?`<br><small>“${esc(c.note)}”</small>`:''}</td>`
      :`<td colspan="4" class="muted">ยังไม่ลงเวลา</td>`}</tr>`);
  }));
  const ex=r.report&&r.report.ciReason?`<div class="warn">เหตุผลที่ลงเวลาไม่ครบ: ${esc(r.report.ciReason)}</div>`:'';
  return `<div class="card"><h2>📷 ลงเวลาเข้าประชุม (สแกนหน้า + GPS)</h2>${ex}<div class="tbl"><table class="t"><thead><tr><th>ผู้เดินทาง</th><th>วันประชุม</th><th>ใบหน้า</th><th>เวลา</th><th>GPS</th><th>ตรวจตำแหน่ง</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>
    <p class="hint">รัศมีที่ยอมรับ ${S().gpsRadius} ม. จากพิกัดห้องประชุม · ภาพใบหน้าใช้เป็นหลักฐานให้หัวหน้า/การเงินตรวจ</p></div>`;
}

      if(st.blob||!$('#modal').classList.contains('on')){s.getTracks().forEach(x=>x.stop());return} // เลือกรูปไปแล้ว / ปิดหน้าต่างแล้ว
      st.stream=s;vid.srcObject=s;msg('จัดใบหน้าให้อยู่ในกรอบ แล้วกด "สแกน"')}
    catch(e){msg('เปิดกล้องไม่ได้ — ใช้ปุ่ม "กล้องมือถือ / เลือกรูป" แทน')}
  };
  const setPhoto=async(canvas)=>{
    st.blob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',.82));
    st.face=null;
    if('FaceDetector' in window){try{const fs=await new FaceDetector({fastMode:true}).detect(canvas);st.face=fs.length>0}catch(e){}}
    $('#ciCam').innerHTML=`<img src="${URL.createObjectURL(st.blob)}" alt="ภาพสแกน"><div class="oval"></div><div class="msg">${st.face===false?'⚠ ไม่พบใบหน้า กรุณาถ่ายใหม่':st.face?'✓ ตรวจพบใบหน้า':'✓ ถ่ายภาพแล้ว'}</div>`;
    if(st.stream){st.stream.getTracks().forEach(x=>x.stop());st.stream=null}
    $('#ciShot').classList.add('hide');$('#ciRe').classList.remove('hide');
  };
  const toCanvas=(src,w,h)=>{const s=Math.min(1,480/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c};
  $('#ciShot').onclick=()=>{if(!vid.videoWidth){toast('กล้องยังไม่พร้อม');return}setPhoto(toCanvas(vid,vid.videoWidth,vid.videoHeight))};
  $('#ciFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>setPhoto(toCanvas(im,im.naturalWidth,im.naturalHeight));im.src=URL.createObjectURL(f)};
  $('#ciRe').onclick=()=>{st.blob=null;st.face=null;$('#ciCam').innerHTML='<video id="ciVid" playsinline muted autoplay></video><div class="oval"></div><div class="msg" id="ciMsg">กำลังเปิดกล้อง...</div>';
    $('#ciShot').classList.remove('hide');$('#ciRe').classList.add('hide');
    const v2=$('#ciVid');$('#ciShot').onclick=()=>{if(!v2.videoWidth){toast('กล้องยังไม่พร้อม');return}setPhoto(toCanvas(v2,v2.videoWidth,v2.videoHeight))};
    navigator.mediaDevices?.getUserMedia({video:{facingMode:'user'}}).then(s=>{st.stream=s;v2.srcObject=s;$('#ciMsg').textContent='จัดใบหน้าให้อยู่ในกรอบ แล้วกด "สแกน"'}).catch(()=>$('#ciMsg').textContent='เปิดกล้องไม่ได้');
  };
  if(navigator.mediaDevices?.getUserMedia)startCam();else msg('เบราว์เซอร์ไม่รองรับกล้อง — ใช้ปุ่มเลือกรูป');
  /* GPS */
  const geoEval=()=>{
    if(!st.pos||r.venueLat==null)return {dist:null,inRange:null};
    const d=distM(st.pos.latitude,st.pos.longitude,r.venueLat,r.venueLng);return {dist:d,inRange:d<=S().gpsRadius};
  };
  const getGps=()=>{
    $('#ciGps').textContent='กำลังขอตำแหน่ง...';
    if(!navigator.geolocation){$('#ciGps').innerHTML='<span style="color:#c62828">อุปกรณ์ไม่รองรับ GPS</span>';return}
    navigator.geolocation.getCurrentPosition(p=>{
      st.pos=p.coords;const g=geoEval();
      $('#ciGps').innerHTML=`<div>${mapLink(p.coords.latitude,p.coords.longitude,`${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`)} <small class="muted">±${Math.round(p.coords.accuracy)} ม.</small></div>
        <div style="margin-top:6px">${g.dist==null?'<span class="pill p-wait">คำขอนี้ไม่มีพิกัดห้องประชุม — บันทึกตำแหน่งให้หัวหน้าตรวจ</span>':g.inRange?`<span class="pill p-ok">✓ อยู่ในที่ประชุม (ห่าง ${fmtDist(g.dist)})</span>`:`<span class="pill p-bad">อยู่นอกรัศมี ${S().gpsRadius} ม. (ห่าง ${fmtDist(g.dist)})</span>`}</div>
        ${p.coords.accuracy>200?'<div class="hint">ความแม่นยำต่ำ — ลองเปิด GPS / ออกไปใกล้หน้าต่างแล้วขอใหม่</div>':''}`;
      $('#ciNoteBox').classList.toggle('hide',!(g.dist!=null&&!g.inRange));
    },e=>{st.pos=null;$('#ciGps').innerHTML=`<span style="color:#c62828">ขอตำแหน่งไม่สำเร็จ: ${esc(e.message)}</span><div class="hint">อนุญาตการเข้าถึงตำแหน่งในเบราว์เซอร์ แล้วกด "ขอตำแหน่งใหม่"</div>`},
    {enableHighAccuracy:true,timeout:20000,maximumAge:0});
  };
  $('#ciGpsBtn').onclick=getGps;getGps();
};

    ${ppl.map(p=>{const q=quotaOf(p.id,fy);return `<tr><td>${esc(p.name)}</td><td>${esc(p.dept)}</td><td class="c">${q.used}</td><td class="c">${q.pending}</td><td class="c"><b>${q.left}</b></td></tr>`}).join('')}

window.exportCSV=fy=>{
  const rows=[['เลขที่','เรื่อง','ประเภท','ผู้จัด','จังหวัด','ผู้ขอ','กลุ่มงาน','จำนวนคน','วันเริ่มประชุม','วันสิ้นสุด','บทบาท','ชม.วิทยากร','ใช้สิทธิ์','ประมาณการ','เบิกจริง','P4P','สถานะ']];
  db.requests.filter(r=>fyOf(r.meetStart)===fy).forEach(r=>{const q=user(r.requesterId);rows.push([r.no,r.title,KIND[r.kind],r.organizer,r.province,q.name,q.dept,people(r).length,r.meetStart,r.meetEnd,ROLE_MEET[r.role],r.speakerHours||0,r.quotaUse?'ใช่':'ไม่',calcEst(r).total,r.claim?calcClaim(r,r.claim).total:'',calcP4P(r).total,STATUS[r.status][0]])});
  const csv='﻿'+rows.map(x=>x.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`ไปประชุม-ปีงบ${fy}.csv`;a.click();
};

function doPrint(html){$('#print').innerHTML=html;setTimeout(()=>window.print(),50)}

}
